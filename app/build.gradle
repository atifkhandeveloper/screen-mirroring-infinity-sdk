android {
    namespace 'com.ezcast.screen.mirroring.totv'

    compileSdk {
        version = release(36)
    }

    defaultConfig {
        applicationId "com.ezcast.screen.mirroring.totv"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"
        multiDexEnabled true
        generatedDensities = []
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        def BOOLEAN = "boolean"
        def STRING = "String"
        def TRUE = "true"
        def FALSE = "false"
        def DEV_MODE = "DEV_MODE"

        debug {
            buildConfigField "String", "email_feedback", "\"glorymobile88@gmail.com\""
            manifestPlaceholders = [app_id: "ca-app-pub-3940256099942544~3347511713"]

            buildConfigField "String", "ERAIN_STUDIO_VERSION", "\"2.1\""
            buildConfigField "String", "PLAY_SERVICES_ADS_VERSION", "\"24.7.0\""
            buildConfigField "String", "GDPR_MODULE_VERSION", "\"2.0.2\""


            buildConfigField "Boolean", "build_debug", "true"
            buildConfigField(BOOLEAN, DEV_MODE, TRUE)
            versionNameSuffix '-dev'
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            firebaseCrashlytics {
                mappingFileUploadEnabled false
            }
        }

        release {
            // ADS CONFIG BEGIN (required)
            buildConfigField "String", "email_feedback", "\"glorymobile88@gmail.com\""
            manifestPlaceholders = [app_id: "ca-app-pub-7208941695689653~1614717305"]


            buildConfigField "String", "ERAIN_STUDIO_VERSION", "\"2.1\""
            buildConfigField "String", "PLAY_SERVICES_ADS_VERSION", "\"24.7.0\""
            buildConfigField "String", "GDPR_MODULE_VERSION", "\"2.0.2\""

            buildConfigField "Boolean", "build_debug", "false"
            buildConfigField(BOOLEAN, DEV_MODE, FALSE)
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            firebaseCrashlytics {
                mappingFileUploadEnabled true
            }
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    aaptOptions {
        additionalParameters "--no-version-vectors"
    }
    buildFeatures {
        viewBinding true
        buildConfig true
        dataBinding = true
    }
